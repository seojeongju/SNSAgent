<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SNSAgent</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --line: #2a3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #243b55 0%, transparent 50%),
        var(--bg);
      color: var(--text);
    }
    main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 0 0 0.35rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; }
    .card {
      background: color-mix(in srgb, var(--panel) 88%, transparent);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      backdrop-filter: blur(8px);
    }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0.65rem 0 0.35rem; }
    select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0c1118;
      color: var(--text);
      padding: 0.75rem;
      font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    .row { display: flex; gap: 0.75rem; margin-top: 0.9rem; flex-wrap: wrap; }
    button {
      border: 0; border-radius: 999px; padding: 0.65rem 1.15rem;
      background: var(--accent); color: white; font-weight: 600; cursor: pointer;
    }
    button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
    button:disabled { opacity: 0.55; cursor: wait; }
    #log {
      margin-top: 1rem; white-space: pre-wrap;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.82rem; color: var(--muted);
      max-height: 360px; overflow: auto;
    }
    .ok { color: #7ddea2; }
    .err { color: #ff8e8e; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>SNSAgent</h1>
    <p class="sub">인스타 릴스 · 유튜브 쇼츠 · 틱톡 · 페이스북 — 한국어 대본/캡션 생성</p>

    <section class="card">
      <div class="grid">
        <div>
          <label for="platform">플랫폼</label>
          <select id="platform">
            <option value="instagram_reels">인스타그램 릴스</option>
            <option value="youtube_shorts">유튜브 쇼츠</option>
            <option value="tiktok">틱톡</option>
            <option value="facebook">페이스북</option>
            <option value="all">4개 플랫폼 한 번에</option>
          </select>
        </div>
        <div>
          <label for="contentType">생성 유형</label>
          <select id="contentType">
            <option value="bundle">대본 + 캡션</option>
            <option value="script">대본만</option>
            <option value="caption">캡션만</option>
          </select>
        </div>
      </div>

      <label for="prompt">주제 / 메시지</label>
      <textarea id="prompt" placeholder="예: 원두커피 홈카페 입문 팁을 짧게 소개하는 숏폼"></textarea>

      <div class="row">
        <button id="generate">한국어 콘텐츠 생성</button>
        <button class="secondary" id="health">헬스체크</button>
      </div>
      <div id="log"></div>
    </section>
  </main>

  <script>
    const userId = "user_demo";
    const logEl = document.getElementById("log");

    function log(msg, cls = "") {
      const line = document.createElement("div");
      if (cls) line.className = cls;
      line.textContent = typeof msg === "string" ? msg : JSON.stringify(msg, null, 2);
      logEl.prepend(line);
    }

    document.getElementById("health").onclick = async () => {
      try {
        const res = await fetch("/api/health");
        log(await res.json(), res.ok ? "ok" : "err");
      } catch (e) {
        log(String(e), "err");
      }
    };

    document.getElementById("generate").onclick = async () => {
      const btn = document.getElementById("generate");
      const topic = document.getElementById("prompt").value.trim();
      const platform = document.getElementById("platform").value;
      let contentType = document.getElementById("contentType").value;
      if (platform === "all") contentType = "bundle";
      if (!topic) return log("주제를 입력하세요.", "err");

      btn.disabled = true;
      log("생성 중...", "ok");
      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_id: userId,
            platform,
            content_type: contentType,
            topic,
          }),
        });
        const data = await res.json();
        log(data, res.ok ? "ok" : "err");
      } catch (e) {
        log(String(e), "err");
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
